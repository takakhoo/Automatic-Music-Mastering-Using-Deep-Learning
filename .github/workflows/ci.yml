name: repository-checks

on:
  push:
  pull_request:

jobs:
  token-unet-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install torch einops
      - run: python -m compileall -q Curriculum_Tokenize_Master src
      - run: python Curriculum_Tokenize_Master/smoke_test.py
